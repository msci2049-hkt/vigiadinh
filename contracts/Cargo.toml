[workspace]
resolver = "2"
members = ["verifier-webauthn"]

[workspace.package]
edition = "2021"
rust-version = "1.91.0"

[workspace.dependencies]
soroban-sdk = "27.0.2"

# Build contract bằng `stellar contract build` (target wasm32v1-none) — KHÔNG cargo build trực tiếp.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
