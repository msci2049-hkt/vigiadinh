[package]
name = "verifier-webauthn"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Ký secp256r1 trong test (mô phỏng authenticator passkey) — CHỈ dev-dependency.
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
