# Lefthook GỐC của monorepo — audit 2026-07-25 §1.3.
#
# Trước phiên đó file này là bản VÍ DỤ của lefthook, comment 100%, và
# `.git/hooks/` chỉ có `prepare-commit-msg` — tức KHÔNG có pre-commit nào chạy.
# Trong khi đó `be/.claude/rules/security.md:10` khẳng định "Pre-commit đã quét
# `S[A-Z0-9]{55}` — không được tắt hook". Docs nói dối chứ không phải code hỏng, và
# đó là dạng tệ hơn: người đọc rules tin là đã có gác nên bỏ bước kiểm bằng tay.
#
# Repo là monorepo (be/ bằng bun, fe/ bằng pnpm) nên hook phải ở GỐC — chạy
# `lefthook install` từ be/ vẫn ghi vào family-wallet/.git/hooks/ và bị file này
# quyết định. Cài: `lefthook install` ở thư mục gốc.

pre-commit:
  parallel: true
  commands:
    # Secret KHÔNG BAO GIỜ lên git. Gọi qua scripts/run-gitleaks.mjs: wrapper tự tải
    # gitleaks 8.30.1 (pin khớp CI .github/workflows/ci.yml) và ĐỐI CHIẾU sha256 với
    # checksums.txt của release trước khi chạy — nên KHÔNG cần cài binary tay nữa,
    # máy mới clone về là hook chạy được ngay.
    # Verb `git --pre-commit` chứ không phải `protect`: `protect` đã deprecated.
    # Cả hai còn chạy trên 8.30.1, nhưng bám verb còn được hỗ trợ để bản sau không gãy.
    gitleaks:
      run: node scripts/run-gitleaks.mjs git --pre-commit --staged --redact --no-banner --config .gitleaks.toml
      fail_text: |
        gitleaks chặn secret trong staged files.
        KHÔNG dùng --no-verify. Gỡ secret ra khỏi diff rồi commit lại.

pre-push:
  parallel: true
  commands:
    # Gate của BE. FE có gate riêng bên fe/ (pnpm) — không gộp, hai trình quản lý
    # gói khác nhau, chạy chéo là hỏng lockfile.
    be-validate:
      root: "be/"
      glob: "be/**/*"
      run: bun run validate
