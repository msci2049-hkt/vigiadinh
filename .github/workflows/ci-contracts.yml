# CI contracts — cargo test + stellar contract build (wasm32v1-none), lọc path contracts/.
name: CI contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/ci-contracts.yml"]
  pull_request:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/ci-contracts.yml"]

concurrency:
  group: ci-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: cargo test (unit + fmt check)
        run: |
          cargo fmt --check
          cargo test --workspace

      - name: Install stellar-cli (pin 27.0.0)
        run: |
          curl -sL -o /tmp/stellar.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          tar -C /tmp -xzf /tmp/stellar.tar.gz stellar
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: stellar contract build (wasm32v1-none)
        run: stellar contract build
