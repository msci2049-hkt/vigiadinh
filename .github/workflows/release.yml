# Build-verify contract với StellarExpert (LÔ 2 — docs/VERIFY-CONTRACT.md §6).
#
# Trigger: push tag `v*` lên MIRROR public (msci2049-hkt/vigiadinh) — tag KHÔNG
# đẩy lên origin private. Mỗi contract một job; reusable workflow của
# stellar-expert build bằng stellar-cli 27.0.0 (`--optimize` + nhúng
# `--meta source_repo=github:<repo>`), tạo GitHub Release đính wasm + build
# attestation, rồi POST hash lên api.stellar.expert/…/contract-validation/match.
#
# ⚠️ Đã biết trước (ghi ở VERIFY-CONTRACT.md): bản deploy hiện tại build KHÔNG
# --optimize và KHÔNG có meta source_repo → hash release nhiều khả năng LỆCH
# hash on-chain. Lệch = nhánh B: muốn badge phải redeploy từ artifact release —
# quyết định đó là của con người, workflow này chỉ sản xuất bằng chứng.
name: Release contracts (StellarExpert verify)

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  recovery-registry:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: "FamilyWallet recovery-registry — guardian vote + timelock + veto"
      relative_path: "contracts"
      package: "recovery-registry"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  web-auth:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: "FamilyWallet web-auth (SEP-45)"
      relative_path: "contracts"
      package: "web-auth"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  origin-verifier:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: "FamilyWallet origin-verifier — pin rpIdHash + origin allow-list"
      relative_path: "contracts"
      package: "origin-verifier"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  verifier-ed25519:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: "FamilyWallet verifier-ed25519"
      relative_path: "contracts"
      package: "verifier-ed25519"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  smart-account:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: "FamilyWallet smart-account — per-household contract wallet (OZ wrap)"
      relative_path: "contracts"
      package: "smart-account"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
