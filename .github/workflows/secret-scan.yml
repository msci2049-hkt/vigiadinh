# Secret scan — LUÔN chạy, không lọc path (PHA 1.5 checklist: "job secret-scan luôn chạy").
# gitleaks CLI full-history với .gitleaks.toml root (có rule stellar-secret-seed:
# seed 'S' + 55 ký tự base32 — phủ yêu cầu grep S[A-Z0-9]{55} của checklist).
# Dùng CLI thay gitleaks-action: action đòi GITLEAKS_LICENSE cho org repo, CLI (MIT) miễn phí.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks quét mọi commit

      - name: gitleaks (full history)
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks git --redact --no-banner
