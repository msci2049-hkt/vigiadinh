# ============================================================================
# Deploy FE → Cloudflare Pages (direct upload).
#
# ⚠️ FILE NÀY PHẢI Ở ROOT. GitHub CHỈ đọc `.github/workflows/` ở gốc repo.
# `fe/.github/workflows/deploy.yml` (bản cũ) CHƯA BAO GIỜ CHẠY — nó nằm trong
# thư mục con của monorepo. Cùng lý do mà `fe/.github/workflows/ci.yml` đã được
# port thành `ci-fe.yml` ở root. Bản cũ đã xoá trong commit này.
#
# Cách B (CI build, Cloudflare chỉ nhận dist/): giữ quyền kiểm soát runtime Node
# + env build-time. Git-connected thì Cloudflare tự build và VITE_* phải đặt
# trong dashboard — mất kiểm soát, và bản build không tái lập được từ repo.
#
# VIỆC CON NGƯỜI phải làm trước khi job này deploy được (nếu thiếu → SKIP deploy,
# job vẫn xanh vì build+gate đã chạy):
#   1. Cloudflare → Workers & Pages → Create → Pages → **Direct Upload**,
#      đặt tên project (mặc định dưới đây: `familyhaven`).
#   2. Account API Token: quyền **Cloudflare Pages — Edit**.
#   3. GitHub repo → Settings → Secrets and variables → Actions:
#        secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#        vars (tuỳ chọn): CF_PAGES_PROJECT_WEB (nếu tên project khác)
#   4. Sau deploy đầu: project → Custom domains → `familyhaven.mscilabs.com`.
#      (Một tầng subdomain → Universal SSL free phủ được. KHÁC
#       `api.familyhaven.mscilabs.com` — hai tầng, xem BLOCKERS B-INFRA-1.)
# ============================================================================
name: Deploy FE

on:
  push:
    branches: [main]
    paths:
      - "fe/**"
      - "shared/**"
      - ".github/workflows/deploy-fe.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fe-prod
  cancel-in-progress: true # FE khác BE: huỷ build cũ an toàn, không có migration

env:
  # Nguồn sự thật DUY NHẤT cho các giá trị production. Đổi ở đây, không rải rác.
  API_ORIGIN: https://api.familyhaven.mscilabs.com
  # MAINNET (migration 2026-07-26): FE gọi Stellar RPC qua proxy BE POST /rpc —
  # không gọi thẳng provider (key nằm server-side). PHẢI = API_ORIGIN + "/rpc"
  # (env block GitHub không nối được từ env khác — đổi API_ORIGIN thì đổi theo).
  RPC_URL: https://api.familyhaven.mscilabs.com/rpc
  # Passphrase MAINNET — chính xác từng ký tự. env.ts đã fail-closed (hết
  # default testnet) nên thiếu/sai biến này là app throw ngay lúc boot.
  STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
  SITE_ORIGIN: https://familyhaven.mscilabs.com
  # rpId KHÔNG ĐẢO LẠI ĐƯỢC — authenticator băm và nhúng vào credential lúc tạo.
  # Đổi giá trị này sau khi có passkey đầu tiên = mọi passkey chết. Xem §3.1.
  PASSKEY_RP_ID: familyhaven.mscilabs.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: fe

    steps:
      - uses: actions/checkout@v4

      # pnpm KHÔNG pin số ở đây — action đọc `packageManager` trong fe/package.json
      # (pnpm@9.15.9). Pin tay là mở đường cho drift CI↔local.
      - uses: pnpm/action-setup@v4

      # Node từ .nvmrc (20) — KHÔNG Bun, và KHÔNG bump lên cho "đỡ lỗi".
      # Bun và Node ≥23.6 strip type nên nạp được `.ts` config cross-package →
      # build xanh GIẢ. Node 20 là host khắt khe nhất, mirror đúng Cloudflare.
      - uses: actions/setup-node@v4
        with:
          node-version-file: "fe/.nvmrc"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # ---- GATE: không deploy thứ chưa qua kiểm ----
      - name: CSP script-hash khớp index.html
        run: node scripts/csp-script-hash.mjs

      - run: pnpm validate
      - run: pnpm test

      # CVE high/critical → đỏ, không deploy. KHÔNG hạ --audit-level.
      - name: Audit (high/critical)
        run: pnpm audit --audit-level=high

      # ---- GATE D1: đủ 5 biến mainnet TRƯỚC khi build ----
      # Cố ý FAIL Ồ ẠT khi GitHub vars chưa điền (khác triết lý skip-deploy của
      # Cloudflare secrets bên dưới): thiếu contract id mainnet mà vẫn ship là
      # ship ví không tạo được / stellar.toml chở template. Điền theo bảng
      # "GitHub vars phải điền" trong MAINNET-CHECKLIST.md rồi chạy lại.
      - name: Gate mainnet vars (D1)
        env:
          VITE_ACCOUNT_WASM_HASH: ${{ vars.VITE_ACCOUNT_WASM_HASH }}
          VITE_WEBAUTHN_VERIFIER_ADDRESS: ${{ vars.VITE_WEBAUTHN_VERIFIER_ADDRESS }}
          VITE_RECOVERY_REGISTRY_ADDRESS: ${{ vars.VITE_RECOVERY_REGISTRY_ADDRESS }}
          VITE_SAC_NATIVE: ${{ vars.VITE_SAC_NATIVE }}
          WEB_AUTH_CONTRACT_ID: ${{ vars.WEB_AUTH_CONTRACT_ID }}
        run: |
          missing=0
          for v in VITE_ACCOUNT_WASM_HASH VITE_WEBAUTHN_VERIFIER_ADDRESS \
                   VITE_RECOVERY_REGISTRY_ADDRESS VITE_SAC_NATIVE WEB_AUTH_CONTRACT_ID; do
            if [ -z "${!v:-}" ]; then echo "❌ thiếu GitHub vars: $v"; missing=1; fi
          done
          if [ "$missing" != "0" ]; then
            echo "→ Settings → Secrets and variables → Actions → Variables; giá trị: MAINNET-CHECKLIST.md mục H1."
            exit 1
          fi
          echo "✅ đủ 5 biến mainnet"

      # ---- BUILD ----
      # Vite nướng VITE_* vào bundle LÚC BUILD. Đặt ở đây, KHÔNG ở dashboard
      # Cloudflare — dashboard chỉ có tác dụng khi Cloudflare tự build.
      #
      # ⚠️ TÊN BIẾN PHẢI KHỚP apps/web/src/lib/env.ts. Đặt sai tên (vd VITE_RP_ID
      # thay vì VITE_PASSKEY_RP_ID) thì Zod lấy DEFAULT — rpId rơi về "localhost",
      # loadEnv() throw lúc chạy → TRẮNG MÀN ở production. Bước "Verify dist"
      # dưới đây bắt đúng ca đó ngay trong CI.
      - name: Build (honest)
        env:
          VITE_API_URL: ${{ env.API_ORIGIN }}
          VITE_STELLAR_RPC_URL: ${{ env.RPC_URL }}
          VITE_STELLAR_NETWORK_PASSPHRASE: ${{ env.STELLAR_NETWORK_PASSPHRASE }}
          VITE_PASSKEY_RP_ID: ${{ env.PASSKEY_RP_ID }}
          # 4 biến chain MAINNET từ GitHub vars (Settings → Secrets and
          # variables → Actions → Variables). Nguồn giá trị: bảng "GitHub vars
          # phải điền" trong MAINNET-CHECKLIST.md. Gate D1 ở trên đã chặn khi
          # trống — tới đây là chắc chắn có giá trị.
          VITE_ACCOUNT_WASM_HASH: ${{ vars.VITE_ACCOUNT_WASM_HASH }}
          VITE_WEBAUTHN_VERIFIER_ADDRESS: ${{ vars.VITE_WEBAUTHN_VERIFIER_ADDRESS }}
          VITE_RECOVERY_REGISTRY_ADDRESS: ${{ vars.VITE_RECOVERY_REGISTRY_ADDRESS }}
          VITE_SAC_NATIVE: ${{ vars.VITE_SAC_NATIVE }}
          VITE_ENABLE_DEVTOOLS: "false"
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN_WEB }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ vars.SENTRY_PROJECT_WEB }}
        run: pnpm build

      # ---- Thay placeholder trong _headers ----
      # _headers giữ __API_ORIGIN__/__RPC_ORIGIN__ để dev không vô tình pin domain
      # prod. Quên thay → connect-src chứa chuỗi rác → trình duyệt bỏ qua token đó
      # → fetch/SSE bị chặn. Fail-closed, nhưng phải bắt Ở ĐÂY chứ không phải ở
      # production.
      - name: Bake CSP origins vào _headers
        run: |
          H=apps/web/dist/_headers
          test -f "$H" || { echo "❌ _headers không vào dist — kiểm apps/web/public/_headers"; exit 1; }
          # __RPC_ORIGIN__ đã gỡ khỏi _headers (RPC đi qua /rpc cùng origin API);
          # placeholder-check ở Verify dist vẫn quét cả hai để bắt sót.
          sed -i "s#__API_ORIGIN__#${API_ORIGIN}#g" "$H"
          echo "--- CSP sau khi thay ---"
          grep -m1 'Content-Security-Policy' "$H"

      # ---- Bake WEB_AUTH_CONTRACT_ID vào stellar.toml (C3) ----
      # Cùng cơ chế sed như _headers: public/ giữ TEMPLATE __WEB_AUTH_CONTRACT_ID__
      # để repo không pin contract id (id gắn chặt network); giá trị thật nằm ở
      # GitHub vars WEB_AUTH_CONTRACT_ID (điền sau khi deploy contracts/web-auth
      # lên MAINNET). Gate D1 đã chặn khi vars trống; gate D5 chặn template sót.
      - name: Bake WEB_AUTH_CONTRACT_ID vào stellar.toml
        env:
          WEB_AUTH_CONTRACT_ID: ${{ vars.WEB_AUTH_CONTRACT_ID }}
        run: |
          T=apps/web/dist/.well-known/stellar.toml
          test -f "$T" || { echo "❌ stellar.toml không vào dist"; exit 1; }
          sed -i "s#__WEB_AUTH_CONTRACT_ID__#${WEB_AUTH_CONTRACT_ID}#g" "$T"
          echo "--- stellar.toml sau khi thay ---"
          grep -m1 'WEB_AUTH_CONTRACT_ID' "$T"

      # ---- Verify output TRƯỚC khi upload — rẻ hơn debug trên production ----
      - name: Verify dist
        run: |
          set -euo pipefail
          D=apps/web/dist

          test -f "$D/index.html"   || { echo "❌ thiếu index.html"; exit 1; }
          test -f "$D/_headers"     || { echo "❌ _headers không vào dist"; exit 1; }
          test -f "$D/_redirects"   || { echo "❌ _redirects không vào dist"; exit 1; }
          # Bundler có thể bỏ qua thư mục bắt đầu bằng dấu chấm — kiểm tường minh.
          test -f "$D/.well-known/stellar.toml" || { echo "❌ stellar.toml không vào dist"; exit 1; }

          # Không còn placeholder/template nào sót trong dist.
          if grep -rq '__API_ORIGIN__\|__RPC_ORIGIN__\|__WEB_AUTH_CONTRACT_ID__' "$D"; then
            echo "❌ còn placeholder chưa thay trong dist"; exit 1
          fi

          # CHỨNG MINH env build-time đã vào bundle. Thiếu bước này thì FE deploy
          # xanh mà gọi API sai, triệu chứng là "trắng màn" rất khó đoán.
          grep -rq 'api\.familyhaven\.mscilabs\.com' "$D/assets" \
            || { echo "❌ API URL không có trong bundle — VITE_API_URL chưa vào build"; exit 1; }

          # ---- GATES MAINNET D2→D5 (MAINNET-CHECKLIST.md) ----
          Q="['\"]"

          # D2: rpId (quoted) PHẢI có. rpId KHÔNG ĐẢO LẠI ĐƯỢC: tên biến sai là
          # giá trị rơi về "localhost" và mọi passkey người dùng tạo sẽ chết vĩnh
          # viễn trên domain thật. Bắt ở đây, đừng để phát hiện khi đã có người dùng.
          grep -rqE "${Q}familyhaven\.mscilabs\.com${Q}" "$D/assets" \
            || { echo "❌ D2: rpId không có trong bundle — VITE_PASSKEY_RP_ID chưa vào build"; exit 1; }

          # D3: apex quoted 'mscilabs.com' KHÔNG được có — apex làm rpId/origin
          # là mở scope passkey cho MỌI subdomain (ký tự trước phải là quote,
          # nên "familyhaven.mscilabs.com" hợp lệ không dính gate này).
          if grep -rqE "${Q}mscilabs\.com${Q}" "$D/assets"; then
            echo "❌ D3: apex mscilabs.com (quoted) xuất hiện trong bundle:"
            grep -roE ".{30}${Q}mscilabs\.com${Q}.{10}" "$D/assets" | head -5
            exit 1
          fi

          # D4: KHÔNG còn dấu vết testnet trong bundle mainnet.
          if grep -rqE 'soroban-testnet|Test SDF Network|friendbot' "$D/assets"; then
            echo "❌ D4: bundle còn dấu vết testnet/friendbot:"
            grep -roE '.{30}(soroban-testnet|Test SDF Network|friendbot).{30}' "$D/assets" | head -5
            exit 1
          fi

          # D5: stellar.toml mainnet — có passphrase mainnet, sạch template + testnet.
          T="$D/.well-known/stellar.toml"
          grep -q 'Public Global Stellar Network ; September 2015' "$T" \
            || { echo "❌ D5: stellar.toml thiếu passphrase mainnet"; exit 1; }
          if grep -qE '__WEB_AUTH_CONTRACT_ID__|Test SDF' "$T"; then
            echo "❌ D5: stellar.toml còn template/testnet"; exit 1
          fi

          # Gate cứng localhost-quoted KHÔNG thêm được: guard fail-closed trong
          # env.ts (`VITE_PASSKEY_RP_ID === "localhost"` + message lỗi) tự chứa
          # literal "localhost" trong bundle → false-positive chính đáng. Giữ
          # cảnh báo mềm dưới đây; D2/D3 mới là gate cứng cho rpId.
          if grep -rqE '"localhost"|rpId:"localhost"' "$D/assets"; then
            echo "⚠️ chuỗi localhost xuất hiện trong bundle — kiểm tra không phải rpId"
            grep -roE '.{40}localhost.{40}' "$D/assets" | head -5
          fi

          # Không ship secret. S... = seed Stellar (luật security.md).
          if grep -rqE 'S[A-Z2-7]{55}|sk_live|BEGIN PRIVATE KEY' "$D"; then
            echo "❌ CÓ SECRET TRONG BUNDLE"; exit 1
          fi
          # Sentry source map không được lên public (plugin đã xoá sau upload).
          if find "$D" -name '*.map' | grep -q .; then
            echo "❌ còn .map trong dist"; find "$D" -name '*.map'; exit 1
          fi

          echo "✅ dist hợp lệ"; du -sh "$D"

      # ---- Deploy ----
      # Chưa có secrets → SKIP deploy, job vẫn xanh (build + gate đã chạy thật).
      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID — SKIP deploy."
          fi

      - name: Deploy (Cloudflare Pages)
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: fe
          command: >
            pages deploy apps/web/dist
            --project-name=${{ vars.CF_PAGES_PROJECT_WEB || 'familyhaven' }}
            --branch=main
            --commit-dirty=true

      # ---- Verify LIVE ----
      # Đo trên CUSTOM DOMAIN, không phải *.pages.dev: pages.dev nằm trong Public
      # Suffix List → khác site với api.familyhaven... → cookie session không set,
      # và người ta sẽ tưởng code sai.
      - name: Verify live
        if: steps.cf.outputs.ready == 'true'
        run: |
          sleep 15
          for i in $(seq 1 10); do
            C=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$SITE_ORIGIN/" || true)
            [ "$C" = "200" ] && break
            if [ "$i" = "10" ]; then echo "❌ site không lên: $C"; exit 1; fi
            sleep 6
          done

          echo "--- header thật trên production ---"
          curl -sI "$SITE_ORIGIN/" | grep -iE 'content-security-policy|strict-transport|x-frame|x-content-type'

          echo "--- SPA fallback (route sâu phải 200, không 404) ---"
          curl -s -o /dev/null -w 'deep route: %{http_code}\n' "$SITE_ORIGIN/wallet/send"

          echo "--- stellar.toml ---"
          curl -s -o /dev/null -w 'stellar.toml: %{http_code}\n' "$SITE_ORIGIN/.well-known/stellar.toml"
          curl -sI "$SITE_ORIGIN/.well-known/stellar.toml" | grep -i 'access-control-allow-origin' \
            || echo "⚠️ stellar.toml thiếu CORS header"
