# CI BE — validate + supply-chain + secrets scan (WP6/WP7).
# Chưa chạy test integration (testcontainers cần tinh chỉnh riêng trên runner)
# — test chạy local qua `bun test`. Xem docs/HARDENING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Khớp version dev (bun.lock ổn định giữa local ↔ CI).
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile

      # typecheck + biome + boundaries + env-parity — không cần DB/Redis.
      - run: bun run validate

      # WP6 — audit gate CHẶN THẬT: CVE high/critical trong deps → đỏ.
      # (Đã sạch từ 2026-07-10 sau đợt vá CVE — better-auth 1.6.23, nodemailer 9,
      # hono 4.12.28, overrides lodash/tmp/undici/protobufjs/grpc-js.)
      - name: Audit (high/critical)
        run: bun audit --audit-level=high

  # WP7 — quét secret FULL HISTORY bằng gitleaks CLI.
  # Dùng CLI thay gitleaks-action: action đòi GITLEAKS_LICENSE cho org repo,
  # CLI (MIT) quét y hệt và miễn phí.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks quét mọi commit

      - name: gitleaks (full history)
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks git --redact --no-banner
