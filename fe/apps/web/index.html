<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Your fingerprint is the key. Your family is the backup."
    />
    <!-- ==== Cài lên màn hình chính (quyết định 2026-07-27) ====
         `<link rel="manifest">` do vite-plugin-pwa TỰ CHÈN (nó biết tên file
         băm). Ba thẻ dưới đây plugin KHÔNG chèn, và thiếu chúng thì trên iOS app
         vẫn mở trong tab Safari có thanh địa chỉ — đúng cái ta vừa quyết định là
         muốn tránh, mà lại hỏng im lặng vì Android thì chạy đúng.
         `theme_color` của manifest chỉ Android đọc; iOS đọc thẻ meta này. -->
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS KHÔNG đọc icon từ manifest — chỉ đọc thẻ này. Sai/thiếu là màn hình
         chính hiện ảnh chụp màn hình trang web thay cho icon. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <!-- Cùng MỘT nguồn với <title> bên dưới. Trước 2026-07-27 chỗ này ghi cứng
         "FamilyWallet" trong khi tab hiện "FamilyHaven" — thẻ chia sẻ mạng xã hội
         mang tên khác với app. Token %VITE_*% chưa thay giờ bị gate dist chặn. -->
    <meta property="og:title" content="%VITE_APP_NAME%" />
    <meta
      property="og:description"
      content="Your fingerprint is the key. Your family is the backup."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <script>
      // FOUC guard — set the theme class before first paint (avoids a light→dark flash).
      // The "ui-theme" literal MUST match THEME_KEY in @repo/ui (theme-store).
      // CSP: this inline script is allow-listed by sha256 hash in deploy/nginx.conf
      // (regenerate the hash if you edit this block — see the README).
      (() => {
        try {
          const raw = localStorage.getItem("ui-theme");
          const theme = raw ? JSON.parse(raw).state.theme : "system";
          const dark =
            theme === "dark" ||
            (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          /* best-effort: theme stays default if storage is unreadable */
        }
      })();
    </script>
    <!-- Single source of truth: Vite substitutes %VITE_APP_NAME% from .env at build/dev. -->
    <title>%VITE_APP_NAME%</title>
  </head>
  <body>
    <div id="root">
      <!--
        First-paint shell: real text plus content-shaped blocks let the browser
        paint before the React entry arrives. createRoot replaces this markup.
      -->
      <main class="app-boot-shell" aria-busy="true">
        <p class="app-boot-brand">%VITE_APP_NAME%</p>
        <div class="app-boot-title"></div>
        <div class="app-boot-line"></div>
        <div class="app-boot-card"></div>
        <div class="app-boot-card"></div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
