# ============================================================================
# nginx mẫu — serve SPA build (dist/) + security headers cho FE template.
#
# QUAN TRỌNG: CSP/headers là tầng HOST (reverse proxy / web server), KHÔNG nằm
# trong Vite build. File này là mẫu — chỉnh cho hạ tầng thật của bạn.
#
# nginx "add_header" gotcha: add_header ở 1 level bị BỎ nếu level con có BẤT KỲ
# add_header nào. Vì vậy ở đây mọi security header khai DUY NHẤT ở server-level,
# còn cache dùng directive `expires` (không phải add_header) nên KHÔNG reset
# inheritance — các location vẫn kế thừa đủ security headers.
# ============================================================================

server {
  listen 80;
  # listen 443 ssl http2;   # production: bật HTTPS + chứng chỉ rồi mở HSTS bên dưới
  server_name _;

  root /usr/share/nginx/html;   # nơi copy dist/ vào
  index index.html;

  # ---- nén ----
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  # brotli on; brotli_comp_level 5; brotli_types text/css application/javascript application/json image/svg+xml;
  #   ^ chỉ khi nginx được build kèm module ngx_brotli.

  # ---- Security headers (NGUỒN DUY NHẤT — khai ở server-level) ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
  # HSTS: CHỈ bật khi đã chạy HTTPS thật (nếu không sẽ khoá nhầm HTTP).
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # ---- Content-Security-Policy (1 dòng) ----
  # - connect-src: BẮT BUỘC liệt kê origin BE để fetch + SSE (/api/events) chạy
  #   cross-origin. placeholder __API_ORIGIN__ — pipeline deploy PHẢI thay bằng origin BE thật (= VITE_API_URL). Xem docs/HUMAN-TODO.md.
  # - script-src: KHÔNG dùng 'unsafe-inline'. Inline FOUC script (index.html) được
  #   allow-list bằng sha256 dưới đây — đổi script đó thì PHẢI regenerate hash
  #   (xem README, mục "CSP cho inline script").
  # - style-src 'unsafe-inline': cần cho inline style attribute do sonner đặt
  #   (CSS custom props --normal-bg…) và inline style runtime của React. Tailwind v4
  #   xuất CSS ra file ngoài (link rel=stylesheet → 'self'), không cần cho stylesheet.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-81loPoXAH2d7v6xD+o+5CuQ/gzjTzt45bNHddccOcTs='; connect-src 'self' __API_ORIGIN__" always;

  # ---- asset có hash → cache dài hạn (dùng `expires`, giữ inheritance) ----
  location /assets/ {
    expires 1y;
    access_log off;
  }

  # ---- index.html KHÔNG cache (để deploy mới có hiệu lực ngay) ----
  location = /index.html {
    expires -1;   # → Cache-Control: no-cache (revalidate)
  }

  # ---- chặn dotfiles (trừ /.well-known cho ACME) ----
  location ~ /\.(?!well-known) {
    deny all;
  }

  # ---- healthcheck của CONTAINER FE (khác /health của BE) ----
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- SPA fallback: mọi path lạ → index.html cho client router xử lý ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}
