# stellar.toml — SEP-1, phục vụ ở HOME DOMAIN (https://familyhaven.mscilabs.com).
# Client SEP-45 đọc file này để biết gọi đâu và tin chữ ký của ai.
#
# ĐỢT TESTNET 2026-07-27 (mainnet flip sau, cùng đợt với 4 contract id).
# WEB_AUTH_CONTRACT_ID là TEMPLATE
# (token WEB-AUTH-CONTRACT-ID hai gạch dưới): deploy-fe.yml sed bằng GitHub vars
# WEB_AUTH_CONTRACT_ID sau khi build (cùng cơ chế token API-ORIGIN của _headers).
# Gate D1 chặn build khi vars trống; gate D5 chặn ship khi template còn sót.
# Contract id gắn chặt với network — GIÁ TRỊ PHẢI là contract web-auth đã deploy
# trên ĐÚNG network của NETWORK_PASSPHRASE dưới đây, không trộn testnet/mainnet.
#
# ⚠️ Xem BLOCKERS B-SEP45-1: backend hiện tách GET/POST ra HAI đường
# (/api/sep45/challenge và /api/sep45/token) trong khi spec đòi MỘT endpoint
# nhận cả hai verb. FE của ta gọi thẳng hai đường đó nên luồng trong app CHẠY,
# nhưng client SEP-45 bên thứ ba đọc file này sẽ hỏng. Giá trị dưới đây là giá
# trị ĐÚNG THEO SPEC — nó sẽ đúng ngay khi backend gộp hai verb về một path.

VERSION = "2.7.0"

NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"

