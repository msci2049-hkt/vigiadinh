# ============================================================================
# Deploy cách B — CI builds (honest), Cloudflare Pages chỉ nhận dist/ qua
# wrangler direct upload. Cloudflare KHÔNG build lại → không còn lỗi build
# trên Cloudflare, deploy nhanh hơn.
#
# KÍCH HOẠT (việc con người — docs/HUMAN-TODO.md):
#   1. Secrets: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages: Edit),
#      CLOUDFLARE_ACCOUNT_ID.
#      (mặc định "web"), VITE_API_URL (URL BE prod — bake vào bundle).
#   3. Sentry source maps: secrets SENTRY_AUTH_TOKEN + vars SENTRY_ORG,
#   4. Cloudflare dashboard: tắt "Automatic deployments" ở Pages project.
# Chưa có secrets → job vẫn XANH: build + audit chạy, phần deploy SKIP có log.
# ============================================================================
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version từ `packageManager` (pnpm@9.15.9) — không drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vite bake VITE_* lúc build. Base = .env.example; override bằng
      # Variables/Secrets nếu đã cấu hình (dòng sau đè dòng trước với dotenv).
      - name: Prepare env
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SENTRY_DSN_WEB: ${{ secrets.VITE_SENTRY_DSN_WEB }}
        run: |
          cp apps/web/.env.example apps/web/.env
          {
            echo ""
            echo "# --- CI overrides ---"
            echo "VITE_ENABLE_DEVTOOLS=false"
            [ -n "$VITE_API_URL" ] && echo "VITE_API_URL=$VITE_API_URL"
            [ -n "$VITE_SENTRY_DSN_WEB" ] && echo "VITE_SENTRY_DSN=$VITE_SENTRY_DSN_WEB"
            true
          } >> apps/web/.env

      # Guard tĩnh trước — độc lập runtime, không Node nào che được bug.
      - run: node scripts/check-host-loaded.mjs

      # Honest build: wrapper tự thêm --no-experimental-strip-types nơi cần.
      # Node từ .nvmrc (20) vốn không strip — mirror đúng host khắt khe nhất.
      - name: Honest build
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ vars.SENTRY_PROJECT_WEB }}

      # Audit gate (WP6): CVE high/critical → đỏ, không deploy.
      - name: Audit (high/critical)
        run: pnpm audit --audit-level=high

      # Secrets chưa có → skip deploy nhưng job vẫn xanh (build được gác rồi).
      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID — SKIP deploy (docs/HUMAN-TODO.md)."
          fi

      # push main → production (--branch=main); pull_request → preview
      # (--branch=<head> → URL <branch>.<project>.pages.dev, không đụng prod).
      - name: Resolve deploy branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy web (Cloudflare Pages)
        if: steps.cf.outputs.ready == 'true'
        run: >
          npx wrangler@4 pages deploy apps/web/dist
          --project-name=${{ vars.CF_PAGES_PROJECT_WEB || 'web' }}
          --branch=${{ steps.branch.outputs.name }}
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
