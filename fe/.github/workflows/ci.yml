name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 20/22 can't strip .ts in host-loaded files → naturally honest.
          - node: 20
            node-options: ""
          - node: 22
            node-options: ""
          # Node 24 strips types by default → would HIDE a cross-package .ts
          # import in vite.config/preset. Disable stripping = the honest gate.
          - node: 24
            node-options: "--no-experimental-strip-types"
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field (pnpm@9.15.9) → no drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: node --version

      - run: pnpm install --frozen-lockfile

      # env.ts validates VITE_API_URL at runtime; the build bakes it in.
      - name: Prepare env
        run: |
          cp apps/web/.env.example apps/web/.env

      # Static guard FIRST: host-loaded configs must not import cross-package .ts
      # (runtime-independent — a modern Node must never hide this bug).
      - run: node scripts/check-host-loaded.mjs

      - run: pnpm exec biome ci .

      - name: Validate (typecheck + boundaries, all workspaces)
        run: pnpm exec turbo run validate
        env:
          NODE_OPTIONS: ${{ matrix.node-options }}

      - name: Unit tests (all workspaces)
        run: pnpm exec turbo run test
        env:
          NODE_OPTIONS: ${{ matrix.node-options }}

      - name: Build (all apps) — honest gate
        run: pnpm exec turbo run build --force
        env:
          NODE_OPTIONS: ${{ matrix.node-options }}

  e2e:
    needs: validate-test-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Prepare env
        run: |
          cp apps/web/.env.example apps/web/.env

      # Installs Chromium/Firefox/WebKit + the OS libraries they need.
      - run: pnpm --filter @repo/${{ matrix.app }} exec playwright install --with-deps chromium firefox webkit

      # webServer in playwright.config.ts builds + previews; no backend required.
      - run: pnpm --filter @repo/${{ matrix.app }} exec playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 7

  # WP6 — CVE high/critical trong deps → đỏ, chặn merge.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit (high/critical)
        run: pnpm audit --audit-level=high

  # WP7 — quét secret FULL HISTORY bằng gitleaks CLI.
  # Dùng CLI thay gitleaks-action: action đòi GITLEAKS_LICENSE cho org repo,
  # CLI (MIT) quét y hệt và miễn phí.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks quét mọi commit
      - name: gitleaks (full history)
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks git --redact --no-banner
