<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
      }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: #6b7280; }
      .count {
        font-size: 32px;
        font-weight: 700;
        color: #dc2626;
      }
      .count.zero { color: #16a34a; }
      button {
        width: 100%;
        padding: 8px 12px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: transparent; color: #2563eb; }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <div class="count zero" id="count">—</div>
    <p id="hint"></p>
    <button id="open" type="button"></button>
    <button class="secondary" id="signin" type="button" hidden></button>
    <script src="popup.js"></script>
  </body>
</html>
